[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pirflow"
version = "0.1.0"
description = "physics-informed reconstruction of flow fields"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "gmsh==4.15.1",
    "matplotlib==3.10.8",
    "meshio==5.3.5",
    "numpy==1.26.4",
    "pandas==3.0.1",
    "pyvista==0.47.0",
    "PyYAML==6.0.3",
    "scikit-learn==1.8.0",
    "scipy==1.17.0",
    "sympy==1.14.0",
    "torch==2.14.1",
    "tqdm==4.67.3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pirflow", "pirflow.*"]
namespaces = false
